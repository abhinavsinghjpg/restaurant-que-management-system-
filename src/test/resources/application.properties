# Server
server.port=0

# ============================================================
# Isolated SQLite database in target/ for testing
# Preserves existing production/local restaurant_queue.db
# ============================================================
spring.datasource.url=jdbc:sqlite:target/test_restaurant_queue.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# App Business Config
# ============================================================
app.queue.avg-service-time-minutes=5
app.queue.max-party-size=10

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false

# ============================================================
# Logging
# ============================================================
logging.level.com.restaurant.queue=INFO
logging.level.org.springframework.security=WARN
