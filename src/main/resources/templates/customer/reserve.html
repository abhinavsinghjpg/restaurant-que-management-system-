<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Book a Table — ' + ${restaurant.name}">Book a Table</title>
    <meta name="description" content="Reserve a table ahead of time at your favorite restaurant.">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-wrapper {
            min-height: 100vh;
            padding: 5rem 1rem 3rem;
            background: radial-gradient(ellipse at 50% 0%, rgba(249, 115, 22, 0.12) 0%, transparent 70%);
        }
        .reserve-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }
        .form-control, .form-select {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            background: var(--bg-dark);
            border-color: var(--primary);
            color: var(--text-primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
        }
        .form-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>

<nav class="navbar rq-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/r/{slug}(slug=${restaurant.slug})}">
            🍽️ <span th:text="${restaurant.name}">Restaurant</span>
        </a>
        <a th:href="@{/r/{slug}(slug=${restaurant.slug})}" class="btn btn-outline-light btn-sm">
            <i class="fas fa-qrcode"></i> Live Queue
        </a>
    </div>
</nav>

<div class="form-wrapper">
    <div class="container" style="max-width: 580px;">

        <div class="reserve-card fade-in-up">
            <div class="text-center mb-4">
                <span class="badge bg-warning-subtle text-warning border border-warning-subtle px-3 py-2 mb-2" style="font-size: 0.8rem; border-radius: 999px;">
                    <i class="fas fa-calendar-check me-1"></i> TABLE RESERVATION
                </span>
                <h2 style="font-weight: 800; color: var(--text-primary); margin-top: 0.5rem;" th:text="${restaurant.name}">Bistro</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Book your dining table ahead of time. Our host team will confirm your slot.
                </p>
            </div>

            <form th:action="@{/r/{slug}/reserve(slug=${restaurant.slug})}" th:object="${reservationRequest}" method="post">

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="customerName" class="form-label">
                        <i class="fas fa-user text-warning me-1"></i> Full Name
                    </label>
                    <input type="text"
                           class="form-control"
                           id="customerName"
                           th:field="*{customerName}"
                           placeholder="e.g. Sneha Patel"
                           th:classappend="${#fields.hasErrors('customerName')} ? 'is-invalid' : ''"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                </div>

                <!-- Mobile -->
                <div class="mb-3">
                    <label for="mobile" class="form-label">
                        <i class="fas fa-mobile-alt text-warning me-1"></i> Mobile Number (10 digits)
                    </label>
                    <input type="tel"
                           class="form-control"
                           id="mobile"
                           th:field="*{mobile}"
                           placeholder="e.g. 9876543210"
                           maxlength="10"
                           th:classappend="${#fields.hasErrors('mobile')} ? 'is-invalid' : ''"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                </div>

                <!-- Guests & Date -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="partySize" class="form-label">
                            <i class="fas fa-users text-warning me-1"></i> Number of Guests
                        </label>
                        <select class="form-select" id="partySize" th:field="*{partySize}" required>
                            <option value="">Select party size</option>
                            <option th:each="i : ${#numbers.sequence(1, 15)}"
                                    th:value="${i}"
                                    th:text="${i == 1 ? '1 Person' : i + ' People'}">1 Person</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('partySize')}" th:errors="*{partySize}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="reservationDate" class="form-label">
                            <i class="fas fa-calendar-alt text-warning me-1"></i> Date
                        </label>
                        <input type="date"
                               class="form-control"
                               id="reservationDate"
                               th:field="*{reservationDate}"
                               th:classappend="${#fields.hasErrors('reservationDate')} ? 'is-invalid' : ''"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('reservationDate')}" th:errors="*{reservationDate}"></div>
                    </div>
                </div>

                <!-- Time Slot -->
                <div class="mb-3">
                    <label for="reservationTime" class="form-label">
                        <i class="fas fa-clock text-warning me-1"></i> Preferred Time
                    </label>
                    <input type="time"
                           class="form-control"
                           id="reservationTime"
                           th:field="*{reservationTime}"
                           th:classappend="${#fields.hasErrors('reservationTime')} ? 'is-invalid' : ''"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('reservationTime')}" th:errors="*{reservationTime}"></div>
                </div>

                <!-- Special Requests -->
                <div class="mb-4">
                    <label for="specialRequests" class="form-label">
                        <i class="fas fa-comment-dots text-warning me-1"></i> Special Requests (Optional)
                    </label>
                    <textarea class="form-control"
                              id="specialRequests"
                              th:field="*{specialRequests}"
                              rows="2"
                              placeholder="e.g. Outdoor seating, birthday anniversary celebration..."></textarea>
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2" style="font-weight: 700; font-size: 1.05rem; border-radius: 12px;">
                    <i class="fas fa-paper-plane me-1"></i> Submit Reservation Request
                </button>
            </form>
        </div>

        <div class="text-center mt-3">
            <a th:href="@{/r/{slug}(slug=${restaurant.slug})}" class="text-decoration-none" style="color: var(--text-muted); font-size: 0.88rem;">
                <i class="fas fa-arrow-left me-1"></i> Back to live walk-in queue
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
