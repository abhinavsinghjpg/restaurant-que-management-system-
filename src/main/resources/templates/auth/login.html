<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — Restaurant Queue</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,107,53,0.08) 0%, transparent 70%);
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card fade-in-up">

        <div class="text-center mb-4">
            <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🔐</div>
            <h1 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem;">Staff Login</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Access the restaurant management dashboard.</p>
        </div>

        <!-- Error message -->
        <div th:if="${loginError}" class="alert alert-danger mb-3">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${loginError}"></span>
        </div>

        <!-- Logout message -->
        <div th:if="${logoutMessage}" class="alert alert-success mb-3">
            <i class="fas fa-check-circle"></i>
            <span th:text="${logoutMessage}"></span>
        </div>

        <!-- Spring Security handles POST /login -->
        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="fas fa-user" style="color: var(--primary);"></i> Username
                </label>
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="fas fa-lock" style="color: var(--primary);"></i> Password
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-100 btn-lg">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="/" style="color: var(--text-muted); font-size: 0.85rem;">
                <i class="fas fa-arrow-left"></i> Back to Customer Queue
            </a>
        </div>

        <!-- Default credentials hint (for development) -->
        <div style="margin-top: 1.5rem; padding: 0.75rem 1rem; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid var(--border); font-size: 0.78rem; color: var(--text-muted);">
            <strong>Default credentials:</strong><br>
            Admin: <code style="color: var(--primary);">admin</code> / <code style="color: var(--primary);">admin123</code><br>
            Staff: <code style="color: var(--primary);">staff</code> / <code style="color: var(--primary);">staff123</code>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
