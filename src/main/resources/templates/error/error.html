<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — Restaurant Queue</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="hero">
    <div class="text-center fade-in-up">
        <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;"
            th:text="${errorTitle} ?: 'Something went wrong'">Error</h1>
        <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto 2rem;"
           th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'">Error message</p>

        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Go Home
            </a>
            <button onclick="history.back()" class="btn btn-outline-light">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
