# Server
server.port=8080

# ============================================================
# SQLite Database (file-based, no server required)
# ============================================================
spring.datasource.url=jdbc:sqlite:restaurant_queue.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix for SQLite + JPA: disable open-in-view
spring.jpa.open-in-view=false

# ============================================================
# App Business Config
# ============================================================
app.queue.avg-service-time-minutes=5
app.queue.max-party-size=10

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false

# ============================================================
# Logging
# ============================================================
logging.level.com.restaurant.queue=DEBUG
logging.level.org.springframework.security=INFO
